apiVersion: v1
kind: ConfigMap
metadata:
  name: reliability-scheduler-config
  namespace: kube-scheduler-reliability
data:
  scheduler-config.yaml: |
    apiVersion: kubescheduler.config.k8s.io/v1
    kind: KubeSchedulerConfiguration
    leaderElection:
      leaderElect: true
      resourceName: reliability-scheduler
      resourceNamespace: kube-scheduler-reliability
    profiles:
      - schedulerName: reliability-scheduler
        plugins:
          # PreFilter plugins
          preFilter:
            enabled:
              # Default Kubernetes plugins
              - name: NodeResourcesFit
              - name: NodePorts
              - name: VolumeBinding
              - name: PodTopologySpread
              - name: InterPodAffinity
              - name: VolumeZone
              - name: NodeAffinity
              # Custom plugin
              - name: ReliabilityScheduler

          # Filter plugins
          filter:
            enabled:
              # Default Kubernetes plugins
              - name: NodeUnschedulable
              - name: NodeName
              - name: TaintToleration
              - name: NodeAffinity
              - name: NodePorts
              - name: NodeResourcesFit
              - name: VolumeRestrictions
              - name: EBSLimits
              - name: GCEPDLimits
              - name: NodeVolumeLimits
              - name: AzureDiskLimits
              - name: VolumeBinding
              - name: VolumeZone
              - name: PodTopologySpread
              - name: InterPodAffinity
              # Custom plugin
              - name: ReliabilityScheduler

          # Score plugins
          score:
            enabled:
              # Default Kubernetes plugins
              - name: NodeResourcesBalancedAllocation
                weight: 1
              - name: ImageLocality
                weight: 1
              - name: InterPodAffinity
                weight: 1
              - name: NodeResourcesFit
                weight: 1
              - name: NodeAffinity
                weight: 1
              - name: PodTopologySpread
                weight: 2
              - name: TaintToleration
                weight: 1
              # Custom plugin - higher weight to prioritize reliability
              - name: ReliabilityScheduler
                weight: 10

        # Plugin configuration
        pluginConfig:
          - name: ReliabilityScheduler
            args:
              apiVersion: kubescheduler.config.k8s.io/v1
              kind: ReliabilitySchedulerArgs
              # Linear regression coefficients
              # These can be overridden by environment variables
              intercept: 0.5
              spreadWeight: 0.3
              hourPerFailureWeight: 0.1
              totalNodesWeight: 0.05
