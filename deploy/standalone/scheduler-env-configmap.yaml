apiVersion: v1
kind: ConfigMap
metadata:
  name: reliability-scheduler-env
  namespace: kube-scheduler-reliability
  labels:
    app: reliability-scheduler
data:
  # ============================================================================
  # Linear Regression Coefficients for Target Spread Calculation
  # ============================================================================
  # The scheduler uses a logarithmic model with different coefficients based on
  # application size (normal: <=10 pods, big: >10 pods)

  # Base coefficients (for big applications, >10 pods)
  RELIABILITY_SCHEDULER_INTERCEPT: "0"
  RELIABILITY_SCHEDULER_SPREAD_WEIGHT: "1"
  RELIABILITY_SCHEDULER_HOUR_PER_FAILURE_WEIGHT: "0"
  RELIABILITY_SCHEDULER_TOTAL_NODES_WEIGHT: "0"

  # Adjustments for normal applications (pods <= 10)
  # These values are ADDED to the base coefficients
  RELIABILITY_SCHEDULER_SPREAD_SMALL_APPS: "0"
  RELIABILITY_SCHEDULER_INTERCEPT_SMALL_APPS: "0"

  # ============================================================================
  # Prometheus Integration Settings
  # ============================================================================
  # URL of Prometheus service for querying hour-per-failure metrics
  PROMETHEUS_URL: "http://prometheus-k8s.monitoring.svc:9090"

  # Default hour-per-failure value when Prometheus metric is unavailable
  # 0.0 = neutral (hpf term has no effect on target spread calculation)
  # Use 8760 for a conservative default (1 failure per year)
  DEFAULT_HOUR_PER_FAILURE: "0.0"

  # Cache TTL for Prometheus metrics
  # Balances freshness vs Prometheus load
  # Valid values: "1m", "5m", "10m", etc.
  METRICS_CACHE_TTL: "5m"

  # Timeout for Prometheus queries
  # Should be low to avoid blocking scheduling decisions
  # Valid values: "50ms", "100ms", "200ms", etc.
  METRICS_QUERY_TIMEOUT: "100ms"

---
# ============================================================================
# NOTES:
# ============================================================================
#
# 1. Model Formula:
#    minAvailApp = log((minAvail + ε) / (1 - minAvail + ε))
#    interceptApp = intercept + interceptAdjustment (based on app size)
#    spreadWeightApp = spreadWeight + spreadWeightAdjustment (based on app size)
#    targetSpread = (minAvailApp - hpf*hpfWeight - totalNodes*nodesWeight - interceptApp) / spreadWeightApp
#    targetSpread = clip(targetSpread, 0, 1)
#
# 2. App Size Categories:
#    - Normal: totalAppPods <= 10
#      → Uses: intercept + interceptSmallApps, spreadWeight + spreadSmallApps
#    - Big: totalAppPods > 10
#      → Uses: intercept, spreadWeight (no adjustments)
#
# 3. How to update coefficients:
#    - Edit this ConfigMap with your trained model coefficients
#    - Apply: kubectl apply -f scheduler-env-configmap.yaml
#    - Restart scheduler: kubectl rollout restart deployment/reliability-scheduler -n kube-scheduler-reliability
#
# 4. Prometheus Recording Rule Expected:
#    Record name: app:reliability:hour_per_failure:1h
#    Labels: {app="<app-name>"}
#    See: deploy/standalone/prometheus-rules.yaml
#
# ============================================================================
