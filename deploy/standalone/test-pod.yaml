apiVersion: v1
kind: Pod
metadata:
  name: test-reliability-scheduler
  labels:
    app: test-app
  annotations:
    # Required annotations
    reliability.scheduler/min-availability: "0.95"
    reliability.scheduler/hour-per-failure: "100.0"
spec:
  # USE THE CUSTOM SCHEDULER
  schedulerName: reliability-scheduler

  containers:
  - name: nginx
    image: nginx:latest
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"

  # This ensures the pod is deleted if it doesn't schedule
  restartPolicy: Never
