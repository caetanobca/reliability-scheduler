apiVersion: v1
kind: ConfigMap
metadata:
  name: reliability-scheduler-config
  namespace: kube-scheduler-reliability
data:
  scheduler-config.yaml: |
    apiVersion: kubescheduler.config.k8s.io/v1
    kind: KubeSchedulerConfiguration
    leaderElection:
      leaderElect: true
      resourceName: reliability-scheduler
      resourceNamespace: kube-scheduler-reliability
    profiles:
      - schedulerName: reliability-scheduler
        plugins:
          # STANDALONE MODE: Only ReliabilityScheduler plugin
          # Default Kubernetes plugins are DISABLED
          # This mode gives you maximum control over scheduling decisions

          preFilter:
            enabled:
              - name: ReliabilityScheduler

          filter:
            enabled:
              - name: ReliabilityScheduler

          score:
            enabled:
              - name: ReliabilityScheduler
                weight: 1  # Only plugin, weight doesn't matter much

        # Plugin configuration
        pluginConfig:
          - name: ReliabilityScheduler
            args:
              # Linear regression coefficients
              # TargetSpread = (MinAvailability - HourPerFailureWeight*HourPerFailure - TotalNodesWeight*TotalNodes - Intercept) / SpreadWeight
              # These can be overridden by environment variables
              intercept: 0.5
              spreadWeight: 0.3
              hourPerFailureWeight: 0.1
              totalNodesWeight: 0.05
